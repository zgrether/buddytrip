name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# A new commit on the same ref supersedes the in-flight run — cancel it instead of
# letting both compete for (sometimes scarce) hosted runners. Keyed by ref so PR
# branches and main are independent; a canceled run just re-runs on the new SHA.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# ── Job timeouts ───────────────────────────────────────────────────────────
# Every job below carries `timeout-minutes`. GitHub's default is 360, which is
# not a timeout so much as an afternoon: on 2026-08-19 two unrelated PRs each
# hung 50+ minutes inside `npx playwright install --with-deps chromium` (apt,
# not the browser — the browser was a cache hit restoring in 2s) and would have
# held the merge gate red, and burned a runner, for six hours apiece before
# failing with nothing in the log to explain it.
#
# Nothing here fixes apt; that is GitHub's side. What these do is turn a silent
# six-hour hang into a legible failure in minutes, for this and every future
# infra stall — a stuck job now reports a timeout, which is a diagnosis, instead
# of a spinner, which is not.
#
# The numbers are ~4-5x observed wall clock, measured on real runs rather than
# picked: `changes` ~7s, `test` 4m18s-4m54s across four runs, `e2e` 4m17s green
# end to end. Generous enough that a slow-but-working run is never killed;
# tight enough that a hang is obvious while you are still looking at the PR.
# If a job legitimately grows past its limit, raise the number — do not remove
# it.

jobs:
  # Decide ONCE whether this change needs the full suite. Both merge-gating jobs
  # read this and skip their own STEPS when it says no, so a docs-only PR reports
  # `test` + `e2e` as passing in seconds instead of booting Docker twice.
  #
  # THE FILTER IS DEFINED BY NEGATION, AND THAT IS THE WHOLE DESIGN. The obvious
  # shape — list what counts as docs, skip when everything matches — FAILS OPEN:
  # add a config file, a new top-level directory, a `.github/` change nobody
  # anticipated, and it silently doesn't match the code list, so CI skips a real
  # change and says green. `'!**/*.md'` inverts the default: the filter is true
  # unless EVERY changed file is markdown, so anything unanticipated runs the
  # suite. Fail loud, not silent — applied to the pipeline itself.
  #
  # BEFORE YOU ADD A PATH HERE "TO BE SAFE", READ THIS:
  #
  #   A FILTER THAT DECIDES WHAT TO RUN IS NOT COVERAGE. It only decides whether
  #   EXISTING coverage executes. Widening it feels like protection and adds
  #   none — if nothing tests a thing, running the whole suite protects it
  #   exactly as much as skipping the suite does: not at all.
  #
  # The urge to widen usually comes from noticing something fragile and reaching
  # for the nearest lever. This is not that lever. The fix for an untested file
  # is a test; the only thing this filter can do is decide when tests that
  # already exist get to run.
  #
  # `src/**` is the one exception to the markdown rule, and it earns its place
  # for the ORDINARY reason that src/ holds the application:
  # src/content/legal/{privacy,terms}.md is shipped content, not documentation,
  # so a change to it is a change to the app.
  #
  # It is NOT here because CI would catch a broken one — and that is the worked
  # instance of the rule above, which is why it is written down rather than
  # quietly fixed. src/app/{privacy,terms}/page.tsx read those files with
  # readFileSync at REQUEST time (privacy/page.tsx:17), so a malformed file fails
  # neither the build nor tsc nor any test; it fails the live page, in prod, on a
  # route nobody visits until they need it. Nothing in this repo renders /privacy
  # or /terms at any layer. The real guard is a render smoke test for the two
  # routes, tracked in #944. Do not read this exception as coverage.
  #
  # On push-to-main the filter is bypassed entirely (see the output expression) —
  # main always gets the full suite regardless of what changed.
  #
  # If this job itself fails, both gated jobs are skipped and their required
  # checks never report, which BLOCKS the PR. That is the intended direction: a
  # broken gate stops the line rather than waving changes through.
  changes:
    runs-on: ubuntu-latest
    # A paths-filter and nothing else (~7s). Bounded anyway: `test` and `e2e`
    # both `needs:` it, so a hang here stalls the whole pipeline just as surely.
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - 'src/**'

  test:
    runs-on: ubuntu-latest
    # eslint + tsc + a local Supabase + the full vitest suite: 4m18s-4m54s observed.
    timeout-minutes: 20
    # GATE THE STEPS, NEVER THE JOB. A job-level `if:` produces a SKIPPED job, and
    # whether a branch ruleset counts "skipped" as satisfying a required check is
    # exactly the ambiguity that leaves a PR pending forever with nothing to click.
    # Both jobs therefore always run and always report their names; the condition
    # lives on each step inside. (`paths-ignore:` on the trigger has the same
    # defect, worse: the check never reports at all.)
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts skips the `supabase` npm package's postinstall, which
      # downloads the CLI binary from GitHub releases and intermittently
      # fails with ECONNRESET in CI. We install the CLI separately via
      # supabase/setup-cli below, so the npm-bundled binary isn't needed.
      - run: npm ci --ignore-scripts
        if: needs.changes.outputs.code == 'true'
      # Lint is merge-blocking, and runs BEFORE the Supabase stack because it
      # needs no database — a lint failure should cost seconds, not a Docker boot.
      #
      # It did not run in CI at all until the 2026-08-08 rules audit
      # (RULES_AUDIT.md §1C), which is why "never hardcode a colour" and every
      # other stated style rule had no way of being true or false.
      # `--max-warnings 0` because a gate that tolerates warnings just accrues
      # them invisibly; the repo is at zero errors AND zero warnings, so holding
      # that line costs nothing and is the only threshold that stays meaningful.
      #
      # NOTE the limit: this enforces the rules ESLint is CONFIGURED with. It does
      # NOT enforce the no-raw-hex rule — that needs a custom rule, which needs an
      # exemption list, which is blocked on the open marketing-CSS question.
      - run: npx eslint --max-warnings 0
        if: needs.changes.outputs.code == 'true'
      - uses: supabase/setup-cli@v1
        if: needs.changes.outputs.code == 'true'
        with:
          # Pinned (not `latest`): `latest` resolves the newest release from a
          # gateway that intermittently times out and blocks the merge-gating job.
          #
          # 2.78.1 → 2.115.0 to test whether #1013 (Realtime never answers a
          # channel join on the runner) is an upstream defect already fixed. Read
          # the PR before concluding anything from a green run: this changes
          # Postgres, GoTrue, PostgREST, Kong and Realtime all at once, so a pass
          # shows the SYMPTOM is gone and is consistent with several stories
          # about why.
          version: 2.115.0
      # Step 0 (ENVIRONMENT_AUDIT.md): the suite runs against an EPHEMERAL LOCAL
      # Supabase started here — NOT the shared prod project. `supabase start` boots
      # the full stack (Docker is preinstalled on ubuntu-latest) and applies every
      # migration in supabase/migrations/. Seed is disabled in config.toml, so the
      # placeholder dev seed.sql never runs. This is what unshares CI from prod: no
      # more churn on the prod IO budget, no cross-branch `db push` deadlock.
      - name: Start local Supabase (applies migrations)
        if: needs.changes.outputs.code == 'true'
        run: supabase start
      - name: Point the suite at local Supabase
        if: needs.changes.outputs.code == 'true'
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
          rm -f supabase.env
      - run: npx tsc --noEmit
        if: needs.changes.outputs.code == 'true'
      - run: npx vitest run
        if: needs.changes.outputs.code == 'true'

  # Critical-path E2E gate (Issue #29 resolved). Runs the merge-blocking smoke
  # tests (auth-setup → stroke game → scores → scorecard, + match-play) against a
  # fresh LOCAL Supabase — same model as the `test` job. Needs `test` first so unit
  # tests gate before we spend time on the browser run.
  #
  # `changes` is in `needs` for the OUTPUT, not for ordering. Gating this job too
  # is the point: `npm ci` + `playwright install` + `npm run build` is most of the
  # wall clock, so gating only `test` would leave a docs PR paying nearly the full
  # bill anyway.
  e2e:
    runs-on: ubuntu-latest
    # Everything `test` does plus a Playwright install, a production build and the
    # three merge-blocking specs: 4m17s observed green. The extra headroom over
    # `test` is for the build, the most variable step here (1m26s observed).
    timeout-minutes: 25
    needs: [changes, test]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
        if: needs.changes.outputs.code == 'true'
      - uses: supabase/setup-cli@v1
        if: needs.changes.outputs.code == 'true'
        with:
          version: 2.115.0
      - name: Start local Supabase (applies migrations)
        if: needs.changes.outputs.code == 'true'
        run: supabase start
      - name: Point the app + suite at local Supabase
        if: needs.changes.outputs.code == 'true'
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
          rm -f supabase.env
      - name: Cache Playwright browser
        if: needs.changes.outputs.code == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium (+ OS deps)
        if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium
      # Build AFTER the local Supabase env is exported. NEXT_PUBLIC_* are inlined at
      # BUILD time, so the app must be built against the LOCAL Supabase URL/anon key —
      # not prod. (The E2E build-ordering fix: previously the build baked in the remote
      # project via job-level secrets.)
      - name: Build app (served by Playwright's webServer)
        if: needs.changes.outputs.code == 'true'
        run: npm run build
      - name: Run critical-path E2E
        if: needs.changes.outputs.code == 'true'
        run: npx playwright test
      - name: Upload report on failure
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
